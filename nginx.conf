server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;
    error_page 404 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Keep directory redirects relative so an HTTPS reverse proxy stays HTTPS.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml text/plain;

    # Clean URLs: /blog/2026/01/post is served from /blog/2026/01/post.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
        add_header Cache-Control "no-cache" always;
    }

    location /css/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location /images/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~ /\. {
        return 404;
    }
}
