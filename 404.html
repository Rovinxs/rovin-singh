<!DOCTYPE html>
<html lang="en-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — Rovin Singh</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#0f1f3a">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
    <style>
        :root { --navy: #0f1f3a; --navy-2: #1a2f52; --gold: #b7802f; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; color: #c9d4e5; background: radial-gradient(900px 420px at 80% -10%, #284a7e 0%, transparent 60%), linear-gradient(180deg, var(--navy), var(--navy-2)); text-align: center; }
        h1 { margin: 0; font-family: "Source Serif 4", Georgia, serif; font-size: clamp(4.5rem, 18vw, 7rem); line-height: 1; color: #fff; }
        p { margin: 14px auto 28px; max-width: 34ch; line-height: 1.6; }
        a { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 10px; font-weight: 600; text-decoration: none; color: #1b1408; background: linear-gradient(135deg, #d4a14f, var(--gold)); }
        a:hover { background: linear-gradient(135deg, #ddb064, #c38c39); }
        a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
        a svg { width: 18px; height: 18px; }
    </style>
</head>
<body>
    <main>
        <h1>404</h1>
        <p>This page doesn't exist or has been moved.</p>
        <a href="/">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5m6 6l-6-6 6-6"/></svg>
            Back to home
        </a>
    </main>
</body>
</html>
